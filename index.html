<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Візитка студента</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #f3f4f6, #dbeafe);
      padding: 50px;
      margin: 0;
      background: yellow;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      display: inline-block;
      max-width: 500px;
    }

    h1 {
      color: #222;
      margin-bottom: 15px;
    }

    p {
      color: #555;
      line-height: 1.6;
      margin: 10px 0;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      background-color: #3b82f6;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      transition: 0.3s;
    }

    .button:hover {
      background-color: #2563eb;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Привіт, я Уляна!</h1>
    <p>Це моя проста HTML-візитка, створена для лабораторної роботи.</p>
    <p>Я навчаюсь на спеціальності "Соціальні комунікації та інформаційна діяльність".</p>
    <p>Цікавлюсь веброзробкою, дизайном та сучасними технологіями.</p>
    <a href="#" class="button">Дізнатись більше</a>
  </div>
</body>
</html>
